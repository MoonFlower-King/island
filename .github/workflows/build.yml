name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Island.sln -c Release -warnaserror

      - name: Publish
        run: dotnet publish src/Island/Island.csproj -c Release -r win-x64 --self-contained false -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: Island-win-x64
          path: publish/
