name: native

# Rust 原生版（native/）：Windows 合成器 + Direct2D，目标是几 MB 的单文件、几十 MB 内存。
on:
  push:
    branches: ["**"]
    paths: ["native/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", ".github/workflows/native.yml"]
  # 发布预览版：在 Actions 页面手动运行，填入版本标签（必须和 Cargo.toml 的版本一致，如 v2.0.0-alpha.1）
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要发布的原生版标签，例如 v2.0.0-alpha.1（留空则只构建不发布）"
        required: false
        default: ""

permissions:
  contents: read

defaults:
  run:
    working-directory: native

jobs:
  # 依赖漏洞扫描：对照 RustSec 漏洞库检查 Cargo.lock
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit --deny warnings

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 版本固定在 rust-toolchain.toml 里，rustup 会自动安装
      - name: Toolchain
        run: rustc --version

      # 手动发布时检查标签格式，并且必须和 Cargo.toml 的版本一致（标签经环境变量传入，不拼进脚本）
      - name: Check release tag
        if: github.event.inputs.release_tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          $tag = "$env:RELEASE_TAG"
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "标签格式不对：$tag" }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($tag.Substring(1) -ne $version) { throw "标签 $tag 和 Cargo.toml 的版本 $version 不一致" }
          Write-Host "发布 $tag"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: native-${{ hashFiles('native/Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test

      - name: Build
        shell: pwsh
        run: |
          cargo build --release
          cargo build --release --target aarch64-pc-windows-msvc
          Get-Item target/release/Island.exe, target/aarch64-pc-windows-msvc/release/Island.exe |
            Format-Table FullName, @{ n = 'KB'; e = { [math]::Round($_.Length / 1KB) } }

      # 在真实 Windows 桌面上启动，走一遍所有功能，截图并检查屏幕上真的画对了。
      # CI 的屏幕是 100% 缩放，再按 150% 强制跑一遍（很多笔记本是 150%，缩放相关的问题只有这样才测得到）
      - name: Smoke test
        shell: pwsh
        run: |
          $failed = @()
          foreach ($scale in @('1', '1.5')) {
            $out = Join-Path $env:RUNNER_TEMP "native-smoke/scale-$scale"
            $env:ISLAND_DATA_DIR = Join-Path $env:RUNNER_TEMP "native-smoke-data-$scale"
            $env:ISLAND_FORCE_SCALE = $scale
            $p = Start-Process -FilePath target/release/Island.exe -ArgumentList '--smoke-test', $out -PassThru
            $null = $p.Handle
            $finished = $p.WaitForExit(150000)
            if (-not $finished) { $p.Kill() }

            Write-Host "===== 缩放 $scale：report.txt ====="
            Get-Content (Join-Path $out 'report.txt') -ErrorAction SilentlyContinue
            Write-Host "===== 缩放 $scale：island.log ====="
            Get-Content (Join-Path $env:ISLAND_DATA_DIR 'island.log') -ErrorAction SilentlyContinue

            if (-not $finished) { $failed += "缩放 $scale 超时" }
            elseif ($p.ExitCode -ne 0) { $failed += "缩放 $scale 有 $($p.ExitCode) 项失败" }
          }
          if ($failed.Count -gt 0) { throw ($failed -join '；') }

      - name: Upload smoke test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke-test
          path: ${{ runner.temp }}/native-smoke/
          if-no-files-found: ignore

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/Island.exe dist/Island-native-win-x64.exe
          Copy-Item target/aarch64-pc-windows-msvc/release/Island.exe dist/Island-native-win-arm64.exe

          # 发布用的压缩包：里面就是 Island.exe
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force packages, stage-x64, stage-arm64 | Out-Null
          Copy-Item target/release/Island.exe stage-x64/Island.exe
          Copy-Item target/aarch64-pc-windows-msvc/release/Island.exe stage-arm64/Island.exe
          Compress-Archive -Path stage-x64/Island.exe -DestinationPath "packages/Island-native-$version-win-x64.zip"
          Compress-Archive -Path stage-arm64/Island.exe -DestinationPath "packages/Island-native-$version-win-arm64.zip"
          Get-ChildItem packages | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding utf8 packages/SHA256SUMS.txt
          Get-Content packages/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Island-native
          path: native/dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Island-native-packages
          path: native/packages/

  # 手动运行并填写标签时发布成 GitHub 预发布版本（不会成为"最新版本"，WPF 版仍是默认下载）
  release:
    needs: [audit, build]
    if: startsWith(github.event.inputs.release_tag, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Island-native-packages
          path: packages

      - name: Release notes
        working-directory: .
        run: |
          version="${TAG#v}"
          # 取 native/CHANGELOG.md 里对应版本的那一节
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' native/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Island 原生版 $version" > notes.md; fi
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          # 标签带 "-"（如 v2.0.0-alpha.4）是预览版；不带的是正式版，设为仓库的最新版本
          name: Island 原生版 ${{ env.TAG }}${{ contains(env.TAG, '-') && '（预览）' || '' }}
          body_path: notes.md
          files: packages/*
          prerelease: ${{ contains(env.TAG, '-') }}
          make_latest: ${{ !contains(env.TAG, '-') }}
